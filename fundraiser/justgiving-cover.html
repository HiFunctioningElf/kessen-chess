<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kessen Chess JustGiving cover</title>
<!-- Source for justgiving-cover.png. Render at 1000x563 (JustGiving's max cover size, 16:9). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+Symbols+2&family=Zen+Kaku+Gothic+New:wght@700&display=swap">
<style>
:root{--ink:#0c0a17;--night:#17122b;--line:#3a2f63;--text:#f4eee2;--muted:#a99fc7;--blood:#ff2e4d;--gold:#ffc83d;--volt:#3fe0ff;
  --display:"Dela Gothic One","Arial Black",Impact,sans-serif;--body:"Zen Kaku Gothic New","Segoe UI",sans-serif;--chess:"Noto Sans Symbols 2","DejaVu Sans",sans-serif}
*{box-sizing:border-box;margin:0}
body{background:var(--ink)}
.cover{position:relative;width:1000px;height:563px;overflow:hidden;color:var(--text);
  background:radial-gradient(ellipse at 50% 55%,#3b1f5e 0%,var(--night) 45%,var(--ink) 80%)}
/* anime speed lines */
.rays{position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.07) 0deg 2deg,transparent 2deg 9deg)}
/* 3D-ish checkerboard floor */
.floor{position:absolute;left:-30%;right:-30%;bottom:-210px;height:420px;transform:perspective(500px) rotateX(62deg);
  background:repeating-conic-gradient(#2a2148 0 25%,#120e22 0 50%) 0 0/90px 90px;
  -webkit-mask:linear-gradient(transparent,#000 45%);mask:linear-gradient(transparent,#000 45%);opacity:.9}
.jp-ghost{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-6deg);font:400 330px/1 var(--display);
  color:var(--blood);opacity:.16;-webkit-text-stroke:3px #000;white-space:nowrap}
.hazard{position:absolute;left:-40px;right:-40px;height:30px;display:flex;align-items:center;justify-content:center;
  background:repeating-linear-gradient(-45deg,var(--gold) 0 18px,#111 18px 36px);box-shadow:0 4px 0 #000}
.hazard span{background:#111;color:var(--blood);font:400 15px var(--display);letter-spacing:.35em;padding:2px 16px;white-space:nowrap}
.hazard.top{top:26px;transform:rotate(-2deg)}
.hazard.bot{bottom:26px;transform:rotate(1.5deg)}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.logo{display:flex;align-items:center;gap:14px}
.logo .jp{font:400 46px/1 var(--display);color:var(--blood);-webkit-text-stroke:1.5px #000;text-shadow:4px 4px 0 #000;transform:rotate(-4deg)}
.logo .en{font:400 26px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;text-shadow:3px 3px 0 #000}
.headline{font:400 92px/1.02 var(--display);color:var(--gold);-webkit-text-stroke:4px #000;paint-order:stroke fill;
  text-shadow:6px 6px 0 #000;transform:rotate(-3deg);margin-top:4px}
.headline .w{color:#fff}
.tag{font:400 25px/1.2 var(--display);color:#fff;background:var(--blood);padding:7px 18px;box-shadow:5px 5px 0 #000;transform:rotate(-1.5deg);margin-top:8px}
.sub{font:700 19px/1.3 var(--body);color:var(--text);text-shadow:2px 2px 0 #000;margin-top:8px}
.sub b{color:var(--volt)}
.piece{position:absolute;font:400 1px/1 var(--chess);text-shadow:6px 6px 0 #000}
.k{left:34px;bottom:62px;font-size:200px;color:var(--text);transform:rotate(-8deg)}
.p{right:50px;bottom:70px;font-size:185px;color:#1b1530;-webkit-text-stroke:3px var(--gold);transform:rotate(9deg)}
.fx{position:absolute;font:400 34px var(--display);color:#fff;-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:3px 3px 0 #7a2cff}
.fx1{left:70px;top:92px;transform:rotate(-12deg)}
.fx2{right:76px;top:96px;transform:rotate(10deg);text-shadow:3px 3px 0 var(--blood)}
.spark{position:absolute;width:14px;height:14px;background:var(--gold);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
</style>
</head>
<body>
<div class="cover">
  <div class="rays"></div>
  <div class="floor"></div>
  <div class="jp-ghost">決戦</div>
  <div class="hazard top"><span>FUNDRAISER ALERT</span></div>
  <div class="hazard bot"><span>EVERY MEAL COUNTS</span></div>
  <div class="piece k">♔</div>
  <div class="piece p">♟</div>
  <div class="fx fx1">ドン!!</div>
  <div class="fx fx2">斬!!</div>
  <i class="spark" style="left:250px;top:150px"></i>
  <i class="spark" style="right:260px;top:170px;width:20px;height:20px"></i>
  <i class="spark" style="left:300px;bottom:120px;width:10px;height:10px"></i>
  <i class="spark" style="right:300px;bottom:150px"></i>
  <div class="center">
    <div class="logo"><span class="jp">決戦</span><span class="en">Kessen Chess</span></div>
    <div class="headline">CHECKMATE<br><span class="w">HUNGER!!</span></div>
    <div class="tag">Raising for Foodbank Queensland</div>
    <div class="sub">Every move you make helps put <b>food on the table</b></div>
  </div>
</div>
</body>
</html>
